name: Delta Neutral Nifty - Paper Trading

on:
  schedule:
    # Runs Monday to Friday at 03:25 UTC (08:55 AM IST) - 20 mins before market open
    - cron: '25 3 * * 1-5'
  workflow_dispatch:

concurrency:
  group: delta-neutral-nifty-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-delta-neutral:
    runs-on: ubuntu-latest
    timeout-minutes: 420  # ~7 hours for full market session (08:55 to 15:35 IST)

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Delta_Neutral_Nifty/requirements.txt

    - name: Configure Git for Live Sync
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Run Engine with Live Dashboard Sync
      env:
        ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
        ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
        ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
        ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      run: |
        # Start the trading engine in the background
        python -m Delta_Neutral_Nifty &
        ENGINE_PID=$!

        # Live sync loop: push positions.json and trade_log.csv to the live-data branch every 30 seconds
        while kill -0 $ENGINE_PID 2>/dev/null; do
          sleep 30

          if kill -0 $ENGINE_PID 2>/dev/null; then
            # Use a isolated temporary folder to avoid workspace branch switching
            rm -rf /tmp/live-sync 2>/dev/null || true
            mkdir -p /tmp/live-sync
            cp positions.json /tmp/live-sync/ 2>/dev/null || true
            cp trade_log.csv /tmp/live-sync/ 2>/dev/null || true

            cd /tmp/live-sync
            git init
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b live-data 2>/dev/null || true
            git add .
            git commit -m "Live Sync Update" 2>/dev/null || true
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git push origin live-data --force 2>/dev/null || true
            cd - >/dev/null
          fi
        done

        # Wait for engine to finish cleanly
        wait $ENGINE_PID || true

    - name: Final Commit & Push Trade Logs
      if: always()
      run: |
        git add positions.json trade_log.csv || true
        git add paper_trades_log.csv logs/ 2>/dev/null || true
        git commit -m "Market close: final state $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST') [skip ci]" || exit 0
        git pull --rebase 2>/dev/null || true
        git push
