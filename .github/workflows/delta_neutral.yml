name: Delta Neutral Nifty - Live Trading

on:
  workflow_dispatch:

concurrency:
  group: delta-neutral-nifty-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ═══════════════════════════════════════════════════════════════
  # LIVE TRADING SESSION (08:55 AM → 03:41 PM IST)
  # Runs on Self-Hosted Windows Runner (Zero Cloud Limits)
  # Automatically monitors positions, executes adjustments,
  # and saves/pushes state to GitHub at market close.
  # ═══════════════════════════════════════════════════════════════
  trading_session:
    runs-on: self-hosted
    timeout-minutes: 420  # 7 hours safety net

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Run Trading Engine (Full Day → 15:41 IST)
      env:
        ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
        ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
        ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
        ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        MARKET_CLOSE_HOUR: "15"
        MARKET_CLOSE_MINUTE: "41"
      shell: powershell
      run: |
        python -m pip install -r Delta_Neutral_Nifty/requirements.txt --quiet
        python -m Delta_Neutral_Nifty --live

    - name: Final Commit & Push Trade Logs
      if: always()
      shell: powershell
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add positions.json trade_log.csv
        git diff --cached --quiet
        if ($LASTEXITCODE -ne 0) {
            git commit -m "Market close: final state $(Get-Date -Format 'yyyy-MM-dd HH:mm IST') [skip ci]"
            git push origin main
        } else {
            Write-Host "No changes to commit."
        }
