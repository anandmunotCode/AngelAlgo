name: Delta Neutral Nifty - Paper Trading

on:
  schedule:
    # Runs Monday to Friday at 03:35 UTC (09:05 AM IST)
    - cron: '35 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-delta-neutral:
    runs-on: ubuntu-latest
    timeout-minutes: 420  # ~7 hours for full market session (09:05 to 15:35 IST)

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Delta_Neutral_Nifty/requirements.txt

    - name: Run Delta Neutral Paper Trading
      env:
        ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
        ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
        ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
        ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      run: |
        python -m Delta_Neutral_Nifty

    - name: Commit & Push Trade Logs
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -A positions.json trade_log.csv paper_trades_log.csv logs/
        git commit -m "Auto-update delta neutral paper trading results [skip ci]" || exit 0
        git push
